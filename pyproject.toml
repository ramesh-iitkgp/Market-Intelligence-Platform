[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "^/(\.venv|build|dist)/"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["backend"]
skip_glob = [".venv/*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto --cov=backend --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
asyncio_mode = "auto"
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (slower, require external services like DB)",
    "api: marks tests as API tests",
    "performance: marks tests as performance tests",
    "benchmark: marks tests as benchmark tests",
    "slow: marks tests as slow running",
]
