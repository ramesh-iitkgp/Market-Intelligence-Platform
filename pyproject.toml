[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "^/(\.venv|build|dist)/"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["backend"]
skip_glob = [".venv/*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
addopts = "-ra"
